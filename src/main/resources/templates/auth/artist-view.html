<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'RevPlay - ' + ${artist.stageName}">Artist - RevPlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/Dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/player.css}">
</head>

<body>
    <div class="d-flex">
        <div th:replace="~{auth/nav-sidebar :: sidebar}"></div>
        <div class="flex-grow-1 p-4 content-area-margin">

            <a href="/dashboard/browse" class="text-info text-decoration-none mb-3 d-inline-block">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Browse
            </a>

            <!-- Artist Profile Card -->
            <div class="card p-4 mt-2 mb-4">
                <div class="d-flex align-items-center gap-4">
                    <img th:src="${artist.profilePic != null ? artist.profilePic : '/images/image2.png'}"
                        class="rounded-circle" style="width:120px;height:120px;object-fit:cover"
                        onerror="this.src='/images/image2.png'" alt="Artist Profile">
                    <div>
                        <h3 class="fw-bold text-white mb-1" th:text="${artist.stageName}">Artist Name</h3>
                        <span class="badge bg-secondary me-2" th:if="${artist.genre != null}">
                            <i class="fa-solid fa-guitar me-1"></i> <span th:text="${artist.genre}"></span>
                        </span>
                        <p class="mt-2 mb-1 text-muted" th:if="${artist.bio != null}" th:text="${artist.bio}">Bio</p>
                        <div class="mt-2 d-flex gap-3">
                            <a th:if="${artist.instagram != null && !artist.instagram.isBlank()}"
                                th:href="${artist.instagram}" target="_blank" class="text-muted">
                                <i class="fa-brands fa-instagram fa-lg"></i>
                            </a>
                            <a th:if="${artist.twitter != null && !artist.twitter.isBlank()}"
                                th:href="${artist.twitter}" target="_blank" class="text-muted">
                                <i class="fa-brands fa-twitter fa-lg"></i>
                            </a>
                            <a th:if="${artist.youtube != null && !artist.youtube.isBlank()}"
                                th:href="${artist.youtube}" target="_blank" class="text-muted">
                                <i class="fa-brands fa-youtube fa-lg"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Artist's Songs -->
            <h5 class="section-title"><i class="fa-solid fa-music me-2 text-info"></i> Songs</h5>
            <table class="table table-dark table-hover mb-4" style="border-radius:12px;overflow:hidden">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Title</th>
                        <th>Album</th>
                        <th>Genre</th>
                        <th>Duration</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="song, iter : ${songs}">
                        <td th:text="${iter.index + 1}">1</td>
                        <td>
                            <a th:href="@{/dashboard/song/{id}(id=${song.songId})}"
                                class="text-info text-decoration-none" th:text="${song.title}">Song</a>
                        </td>
                        <td>
                            <a th:if="${song.albumId != null}" th:href="@{/dashboard/album/{id}(id=${song.albumId})}"
                                class="text-white text-decoration-none"
                                th:text="${song.albumName != null ? song.albumName : '-'}">Album</a>
                            <span th:if="${song.albumId == null}" class="text-muted">Single</span>
                        </td>
                        <td th:text="${song.genre}">Genre</td>
                        <td
                            th:text="${song.duration / 60 + ':' + (song.duration % 60 < 10 ? '0' : '') + song.duration % 60}">
                            0:00</td>
                        <td>
                            <button class="btn btn-sm btn-success rounded-pill"
                                th:onclick="playSong([[${song.songId}]], [[${song.title}]], [[${song.artistName != null ? song.artistName : 'Unknown'}]], [[${song.songUrl}]], [[${song.coverArt != null ? song.coverArt : '/images/image1.png'}]])"
                                title="Play">
                                <i class="fa-solid fa-play"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger rounded-pill"
                                th:onclick="'addFavorite(' + ${song.songId} + ')'" title="Favorite">
                                <i class="fa-solid fa-heart"></i>
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${songs == null || songs.isEmpty()}">
                        <td colspan="6" class="text-center text-muted py-3">No songs yet.</td>
                    </tr>
                </tbody>
            </table>

            <!-- Artist's Albums -->
            <h5 class="section-title"><i class="fa-solid fa-compact-disc me-2 text-success"></i> Albums</h5>
            <div class="row g-3">
                <div th:if="${albums == null || albums.isEmpty()}">
                    <div class="empty-state">No albums yet.</div>
                </div>
                <div class="col-md-3" th:each="alb : ${albums}">
                    <a th:href="@{/dashboard/album/{id}(id=${alb.albumId})}" class="text-decoration-none">
                        <div class="card">
                            <img th:src="${alb.coverArt != null ? alb.coverArt : '/images/image1.png'}"
                                class="card-img-top album-img-dashboard" alt="Album Cover"
                                onerror="this.src='/images/image1.png'">
                            <div class="card-body p-3">
                                <h6 class="text-white mb-0" th:text="${alb.name}">Album</h6>
                                <small class="text-muted"
                                    th:text="${alb.releaseDate != null ? alb.releaseDate : ''}"></small>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{auth/music-player :: player}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/player.js}"></script>
    <script th:inline="javascript">
        const loggedUserId = /*[[${user != null ? user.userId : ''}]]*/ null;

        // Build initial queue on load
        document.addEventListener('DOMContentLoaded', buildQueueFromPage);
        function addFavorite(songId) {
            fetch('/dashboard/favorites/add/' + songId, { method: 'POST' })
                .then(res => res.text())
                .then(data => {
                    if (data === "Success") alert('Added to favorites!');
                    else alert(data);
                });
        }
    </script>
</body>

</html>
