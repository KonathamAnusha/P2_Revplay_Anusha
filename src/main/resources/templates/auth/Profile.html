<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile - RevPlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/Dashboard.css}">
</head>

<body>
    <div class="container mt-5" style="max-width:600px;">
        <h3 class="fw-bold mb-4"><i class="fa-solid fa-user-pen me-2 text-info"></i> Edit Profile</h3>

        <form th:action="@{/dashboard/profile/{id}(id=${user.userId})}" method="post">

            <div class="mb-3">
                <label for="displayName" class="form-label small text-muted">Display Name</label>
                <input type="text" id="displayName" name="displayName" th:value="${user.displayName}"
                    class="form-control bg-dark text-white border-secondary" placeholder="Enter display name">
            </div>

            <div class="mb-3">
                <label for="bio" class="form-label small text-muted">Bio</label>
                <textarea id="bio" name="bio" class="form-control bg-dark text-white border-secondary" rows="3"
                    placeholder="Tell us about yourself" th:text="${user.bio}"></textarea>
            </div>

            <div class="mb-3">
                <label for="profilePicture" class="form-label small text-muted">Profile Picture URL</label>
                <input type="text" id="profilePicture" name="profilePicture" th:value="${user.profilePicture}"
                    class="form-control bg-dark text-white border-secondary"
                    placeholder="https://example.com/photo.jpg">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label small text-muted">Change Password</label>
                <input type="password" id="password" name="password"
                    class="form-control bg-dark text-white border-secondary" placeholder="Leave blank to keep current">
            </div>

            <button type="submit" class="btn btn-revplay w-100 mt-2"><i class="fa-solid fa-check me-1"></i> Update
                Profile</button>
        </form>

        <div class="mt-3 text-center">
            <a href="/dashboard" class="text-info text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Back
                to Dashboard</a>
        </div>
    </div>

</body>

</html>
