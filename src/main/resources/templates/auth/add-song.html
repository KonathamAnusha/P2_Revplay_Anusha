<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Upload New Song - RevPlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/Dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/player.css}">
</head>

<body>
    <div class="d-flex">
        <!-- Sidebar Navigation -->
        <div th:replace="~{auth/nav-sidebar :: sidebar}"></div>

        <div class="flex-grow-1 p-4 content-area-margin overflow-auto">
            <!-- TOP BAR -->
            <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary">
                <h4 class="welcome-header mb-0">
                    <i class="fa-solid fa-cloud-arrow-up text-accent-green"></i> Upload Song
                </h4>
                <a th:href="@{/dashboard}" class="btn btn-outline-light btn-sm rounded-pill px-3">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
                </a>
            </div>

            <!-- UPLOAD FORM SECTION -->
            <div class="row justify-content-center">
                <div class="col-lg-8 col-xl-7">
                    <div class="card bg-glass border-0 shadow-lg mt-4">
                        <div class="card-body p-5">
                            <div class="text-center mb-4">
                                <div class="d-inline-flex justify-content-center align-items-center rounded-circle bg-dark shadow-sm mb-3"
                                    style="width: 80px; height: 80px; border: 2px solid rgba(255,255,255,0.1);">
                                    <i class="fa-solid fa-music fa-2x text-accent-green"></i>
                                </div>
                                <h3 class="text-white fw-bold">Publish to RevPlay</h3>
                                <p class="text-muted small">Share your latest track with the world. We'll automatically
                                    extract cover art from your MP3 file.</p>
                            </div>

                            <form th:action="@{/dashboard/song/add}" method="POST" enctype="multipart/form-data">
                                <div class="row g-4">
                                    <div class="col-12">
                                        <label class="form-label small text-secondary fw-semibold">Song Title <span
                                                class="text-danger">*</span></label>
                                        <input type="text" name="title"
                                            class="form-control bg-dark text-white border-secondary border-opacity-50"
                                            placeholder="e.g. Summer Vibes" required>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label small text-secondary fw-semibold">Genre <span
                                                class="text-danger">*</span></label>
                                        <input type="text" name="genre"
                                            class="form-control bg-dark text-white border-secondary border-opacity-50"
                                            placeholder="e.g. Pop, Jazz" required>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label small text-secondary fw-semibold">Language <span
                                                class="text-danger">*</span></label>
                                        <select name="language"
                                            class="form-select bg-dark text-white border-secondary border-opacity-50"
                                            required>
                                            <option value="English" selected>English</option>
                                            <option value="Hindi">Hindi</option>
                                            <option value="Telugu">Telugu</option>
                                            <option value="Tamil">Tamil</option>
                                            <option value="Kannada">Kannada</option>
                                            <option value="Malayalam">Malayalam</option>
                                            <option value="Spanish">Spanish</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>

                                    <div class="col-12">
                                        <label class="form-label small text-secondary fw-semibold">Album
                                            (Optional)</label>
                                        <select name="albumId"
                                            class="form-select bg-dark text-white border-secondary border-opacity-50">
                                            <option value="">-- Single (No Album) --</option>
                                            <option th:each="album : ${myAlbums}" th:value="${album.albumId}"
                                                th:text="${album.name}"></option>
                                        </select>
                                        <div class="form-text text-muted mt-1" style="font-size: 0.7rem;"><i
                                                class="fa-solid fa-info-circle"></i> Create albums from your dashboard
                                            first.</div>
                                    </div>

                                    <div class="col-12">
                                        <div class="card bg-dark border border-secondary border-opacity-50">
                                            <div class="card-body p-4 text-center">
                                                <label class="form-label d-block text-white mb-3 fw-semibold">Audio File
                                                    (MP3/WAV) <span class="text-danger">*</span></label>
                                                <input type="file" name="audioFile"
                                                    class="form-control bg-transparent text-white border-0"
                                                    accept="audio/*" required>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <hr class="border-secondary my-4">

                                <div class="d-flex justify-content-end gap-3">
                                    <a th:href="@{/dashboard}"
                                        class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                                    <button type="submit" class="btn btn-success py-2 px-4 rounded-pill fw-bold">
                                        <i class="fa-solid fa-upload me-2"></i> Upload Song
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Music Player (hidden but required for script bounds) -->
    <div th:replace="~{auth/music-player :: player}" style="display:none;"></div>
    <script th:src="@{/js/player.js}"></script>
</body>

</html>
