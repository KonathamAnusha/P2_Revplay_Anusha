<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RevPlay - Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/user_login.css}">
</head>

<body>
    <div class="container">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-success">RevPlay</h2>
            <p class="text-light">Welcome back!</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger py-2 small">Invalid email or password. Please try again.
        </div>
        <div th:if="${param.logout}" class="alert alert-info py-2 small">You have been logged out successfully.</div>
        <div th:if="${loginError}" class="alert alert-danger py-2 small" th:text="${loginError}"></div>
        <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>

        <form th:action="@{/auth/login}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label small">Email Address</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" class="form-control"
                    required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label small">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" class="form-control"
                    required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-success w-100 fw-bold">Login</button>

            <button type="button" class="btn btn-outline-light w-100 mt-2 btn-sm" onclick="window.location.href='/'">
                Back to Home
            </button>
        </form>

        <hr class="my-4 bg-light">

        <p class="text-center small mb-0">
            Don't have an account? <a th:href="@{/auth/register}"
                class="text-info text-decoration-none fw-bold">Register Now</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
