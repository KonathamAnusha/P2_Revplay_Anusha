<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RevPlay - Register</title>
    <link rel="stylesheet" th:href="@{/css/User_Register.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <h3 class="mb-4 text-center">Create an Account</h3>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <form th:action="@{/auth/register}" th:object="${userDTO}" method="post">
            <div class="mb-2">
                <label for="fullName" class="form-label">Full Name</label>
                <input type="text" id="fullName" th:field="*{fullName}" placeholder="Full Name" class="form-control"
                    required>
            </div>
            <div class="mb-2">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" th:field="*{email}" placeholder="Email" class="form-control" required>
            </div>
            <div class="mb-2">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" th:field="*{password}" placeholder="Password" class="form-control"
                    required>
            </div>
            <div class="mb-2">
                <label for="displayName" class="form-label">Display Name</label>
                <input type="text" id="displayName" th:field="*{displayName}" placeholder="Display Name"
                    class="form-control">
            </div>
            <div class="mb-2">
                <label for="bio" class="form-label">Bio</label>
                <textarea id="bio" th:field="*{bio}" placeholder="Short bio..." class="form-control"></textarea>
            </div>
            <div class="mb-2">
                <label for="profilePicture" class="form-label">Profile Picture URL</label>
                <input type="text" id="profilePicture" th:field="*{profilePicture}" placeholder="URL to profile pic"
                    class="form-control">
            </div>

            <div class="mb-3">
                <label for="roleSelect" class="form-label">I want to be a:</label>
                <select th:field="*{role}" id="roleSelect" class="form-select">
                    <option value="LISTENER">Listener</option>
                    <option value="ARTIST">Artist</option>
                </select>
            </div>

            <!-- Artist Fields -->
            <div id="artistFields" style="display:none;" class="border p-3 rounded mb-3 bg-secondary">
                <h6 class="mb-3">Artist Profile Details</h6>
                <div class="mb-2">
                    <label for="stageName" class="form-label">Stage Name</label>
                    <input type="text" id="stageName" th:field="*{artistProfile.stageName}" placeholder="Stage Name"
                        class="form-control">
                </div>
                <div class="mb-2">
                    <label for="genre" class="form-label">Genre</label>
                    <input type="text" id="genre" th:field="*{artistProfile.genre}" placeholder="e.g. Pop, Jazz"
                        class="form-control">
                </div>
                <div class="mb-2">
                    <label for="bannerImage" class="form-label">Banner Image URL</label>
                    <input type="text" id="bannerImage" th:field="*{artistProfile.bannerImage}"
                        placeholder="URL to banner image" class="form-control">
                </div>
                <div class="mb-2">
                    <label for="instagram" class="form-label">Instagram</label>
                    <input type="text" id="instagram" th:field="*{artistProfile.instagram}"
                        placeholder="Instagram handle/link" class="form-control">
                </div>
                <div class="mb-2">
                    <label for="twitter" class="form-label">Twitter</label>
                    <input type="text" id="twitter" th:field="*{artistProfile.twitter}"
                        placeholder="Twitter handle/link" class="form-control">
                </div>
                <div class="mb-2">
                    <label for="youtube" class="form-label">YouTube</label>
                    <input type="text" id="youtube" th:field="*{artistProfile.youtube}"
                        placeholder="YouTube channel link" class="form-control">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Register</button>
            <a th:href="@{/auth/login}" class="btn btn-outline-light w-100 mt-2">Back to Login</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/User_Register.js}"></script>
</body>

</html>
