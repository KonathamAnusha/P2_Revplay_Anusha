<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Albums - RevPlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/Dashboard.css}">
</head>

<body class="bg-primary text-white">
    <div class="d-flex">
        <div th:replace="~{auth/nav-sidebar :: sidebar}"></div>
        <div class="flex-grow-1 p-4 content-area-margin">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary">
                <h4 class="welcome-header mb-0"><i class="fa-solid fa-compact-disc text-info"></i> My Albums</h4>
                <a href="/dashboard" class="btn btn-outline-light btn-sm rounded-pill px-3">
                    <i class="fa-solid fa-arrow-left me-1"></i> Dashboard
                </a>
            </div>

            <div class="card bg-glass border-0 shadow-lg">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-dark table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-4">Album</th>
                                    <th class="text-center">Tracks</th>
                                    <th>Release Status</th>
                                    <th class="text-end pe-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="album : ${myAlbums}">
                                    <td class="ps-4 py-3">
                                        <div class="d-flex align-items-center gap-3">
                                            <img th:src="${album.coverArt}" class="rounded"
                                                style="width:45px; height:45px; object-fit:cover;"
                                                onerror="this.src='/images/image1.png'">
                                            <div>
                                                <div class="fw-bold text-white mb-0" th:text="${album.name}">Album Name
                                                </div>
                                                <small class="text-muted text-truncate-elegant d-block"
                                                    style="max-width: 300px;"
                                                    th:text="${album.description}">Desc</small>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="text-center">
                                        <span class="badge bg-blue-soft text-info"
                                            th:text="${album.songIds != null ? album.songIds.size() : 0}">0</span>
                                    </td>
                                    <td>
                                        <span class="badge bg-success-soft text-success px-2">Published</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <a th:href="@{/dashboard/album/{id}(id=${album.albumId})}"
                                            class="btn btn-outline-info btn-sm rounded-pill py-1 px-3">View Details</a>
                                    </td>
                                </tr>
                                <tr th:if="${myAlbums == null || myAlbums.isEmpty()}">
                                    <td colspan="4" class="py-5 text-center text-muted italic">No albums created yet.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{auth/music-player :: player}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
