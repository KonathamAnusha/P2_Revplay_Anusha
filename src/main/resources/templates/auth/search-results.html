<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search - RevPlay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/Dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/player.css}">
</head>

<body>
    <div class="d-flex">
        <div th:replace="~{auth/nav-sidebar :: sidebar}"></div>
        <div class="flex-grow-1 p-4" style="margin-bottom:80px;">
            <h4>🔍 Search Results for "<span th:text="${query}"></span>"</h4>

            <!-- Songs -->
            <h5 class="mt-4">🎵 Songs</h5>
            <table class="table table-dark table-hover">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Title</th>
                        <th>Genre</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="song, iter : ${songs}">
                        <td th:text="${iter.index + 1}">1</td>
                        <td th:text="${song.title}">Song</td>
                        <td th:text="${song.genre}">Genre</td>
                        <td><button class="btn btn-sm btn-success" th:onclick="'playSongById(' + ${song.songId} + ')'"
                                title="Play Song" aria-label="Play Song">▶</button></td>
                    </tr>
                    <tr th:if="${songs.isEmpty()}">
                        <td colspan="4" class="text-muted">No songs found.</td>
                    </tr>
                </tbody>
            </table>

            <!-- Albums -->
            <h5 class="mt-4">💿 Albums</h5>
            <div class="row g-3 mb-4">
                <div th:if="${albums.isEmpty()}">
                    <p class="text-muted">No albums found.</p>
                </div>
                <div class="col-md-3" th:each="album : ${albums}">
                    <div class="card bg-secondary text-white">
                        <img th:src="${album.coverArt}" class="card-img-top" alt="cover"
                            style="height:150px;object-fit:cover;" onerror="this.src='/images/image1.png'">
                        <div class="card-body p-2">
                            <h6 th:text="${album.name}">Album</h6>
                            <a th:href="@{/dashboard/album/{id}(id=${album.albumId})}"
                                class="btn btn-sm btn-outline-light">View</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Playlists -->
            <h5 class="mt-4">📂 Playlists</h5>
            <div class="row g-3">
                <div th:if="${playlists.isEmpty()}">
                    <p class="text-muted">No playlists found.</p>
                </div>
                <div class="col-md-4" th:each="pl : ${playlists}">
                    <div class="card bg-secondary text-white">
                        <div class="card-body">
                            <h6 th:text="${pl.name}">Playlist</h6>
                            <span class="badge bg-info" th:text="${pl.privacy}">PUBLIC</span>
                            <a th:href="@{/dashboard/playlist/{id}(id=${pl.playlistId})}"
                                class="btn btn-sm btn-outline-light mt-2">View</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{auth/music-player :: player}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/player.js}"></script>
    <script th:src="@{/js/browse.js}"></script>
</body>

</html>
