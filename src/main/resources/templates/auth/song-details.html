<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'RevPlay - ' + ${song.title}">Song Details - RevPlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/Dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/player.css}">
</head>

<body>
    <div class="d-flex">
        <div th:replace="~{auth/nav-sidebar :: sidebar}"></div>
        <div class="flex-grow-1 p-4 content-area-margin">

            <!-- Back link -->
            <a href="/dashboard/browse" class="text-info text-decoration-none mb-3 d-inline-block">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Browse
            </a>

            <div class="card p-4 mt-2">
                <div class="d-flex align-items-start gap-4">
                    <!-- Cover Art -->
                    <img th:src="${song.coverArt != null ? song.coverArt : '/images/image1.png'}" class="rounded"
                        style="width:200px;height:200px;object-fit:cover" onerror="this.src='/images/image1.png'"
                        alt="Cover Art">

                    <!-- Song Info -->
                    <div class="flex-grow-1">
                        <h3 class="fw-bold text-white mb-1" th:text="${song.title}">Song Title</h3>

                        <p class="mb-1">
                            <i class="fa-solid fa-user me-1 text-muted"></i>
                            <a th:if="${song.artistId != null}" th:href="@{/dashboard/artist/{id}(id=${song.artistId})}"
                                class="text-info text-decoration-none"
                                th:text="${song.artistName != null ? song.artistName : 'Unknown'}">Artist</a>
                            <span th:if="${song.artistId == null}" class="text-muted">Unknown Artist</span>
                        </p>

                        <p class="mb-1">
                            <i class="fa-solid fa-compact-disc me-1 text-muted"></i>
                            <a th:if="${song.albumId != null}" th:href="@{/dashboard/album/{id}(id=${song.albumId})}"
                                class="text-info text-decoration-none"
                                th:text="${song.albumName != null ? song.albumName : 'Unknown'}">Album</a>
                            <span th:if="${song.albumId == null}" class="text-muted">Single</span>
                        </p>

                        <div class="row mt-3">
                            <div class="col-auto">
                                <span class="badge bg-secondary"><i class="fa-solid fa-guitar me-1"></i>
                                    <span th:text="${song.genre}">Genre</span></span>
                            </div>
                            <div class="col-auto">
                                <span class="badge bg-secondary"><i class="fa-solid fa-globe me-1"></i>
                                    <span th:text="${song.language}">Language</span></span>
                            </div>
                            <div class="col-auto">
                                <span class="badge bg-secondary"><i class="fa-solid fa-clock me-1"></i>
                                    <span
                                        th:text="${song.duration / 60 + ':' + (song.duration % 60 < 10 ? '0' : '') + song.duration % 60}">0:00</span></span>
                            </div>
                            <div class="col-auto" th:if="${song.createdAt != null}">
                                <span class="badge bg-secondary"><i class="fa-solid fa-calendar me-1"></i>
                                    <span
                                        th:text="${#temporals.format(song.createdAt, 'yyyy-MM-dd')}">Date</span></span>
                            </div>
                        </div>

                        <div class="mt-4 d-flex gap-2">
                            <button class="btn btn-revplay"
                                th:onclick="playSong([[${song.songId}]], [[${song.title}]], [[${song.artistName != null ? song.artistName : 'Unknown'}]], [[${song.songUrl}]], [[${song.coverArt != null ? song.coverArt : '/images/image1.png'}]])">
                                <i class="fa-solid fa-play me-1"></i> Play
                            </button>
                            <button class="btn btn-outline-danger rounded-pill"
                                th:onclick="'addFavorite(' + ${song.songId} + ')'">
                                <i class="fa-solid fa-heart me-1"></i> Add to Favorites
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{auth/music-player :: player}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/player.js}"></script>
    <script th:inline="javascript">
        const loggedUserId = /*[[${user != null ? user.userId : ''}]]*/ null;

        // Build initial queue on load
        document.addEventListener('DOMContentLoaded', buildQueueFromPage);
        function addFavorite(songId) {
            fetch('/dashboard/favorites/add/' + songId, { method: 'POST' })
                .then(res => res.text())
                .then(data => {
                    if (data === "Success") alert('Added to favorites!');
                    else alert(data);
                });
        }
    </script>
</body>

</html>
