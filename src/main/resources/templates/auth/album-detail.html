<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Album - RevPlay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/Dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/player.css}">
    <style>
        .select2-container--default .select2-selection--single {
            background-color: #212529 !important;
            border: 1px solid rgba(255, 255, 255, 0.25) !important;
            height: 38px !important;
        }

        .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: #fff !important;
            line-height: 36px !important;
        }

        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 36px !important;
        }

        .select2-dropdown {
            background-color: #212529 !important;
            border: 1px solid rgba(255, 255, 255, 0.25) !important;
            color: #fff !important;
        }

        .select2-container--default .select2-search--dropdown .select2-search__field {
            background-color: #2b3035 !important;
            color: #fff !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }

        .select2-container--default .select2-results__option[aria-selected=true] {
            background-color: #495057 !important;
        }

        .select2-container--default .select2-results__option--highlighted[aria-selected] {
            background-color: #198754 !important;
        }
    </style>
</head>

<body>
    <div class="d-flex">
        <!-- SIDEBAR -->
        <div th:replace="~{auth/nav-sidebar :: sidebar}"></div>
        <div class="flex-grow-1 p-4 overflow-auto content-area-margin">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <a th:href="@{/dashboard}" class="btn btn-outline-light btn-sm rounded-pill" title="Back to Dashboard">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back
                </a>
                <div class="text-accent-green small fw-bold"><i class="fa-solid fa-compact-disc"></i> Album Details
                </div>
            </div>

            <!-- Album Header Card -->
            <div class="card mb-4 bg-glass border-0 shadow-lg">
                <div class="card-body p-4">
                    <div class="row align-items-center">
                        <div class="col-auto">
                            <img th:src="${album.coverArt}" alt="Cover" class="rounded shadow-lg"
                                style="width:160px;height:160px;object-fit:cover;"
                                onerror="this.src='/images/image1.png'">
                        </div>
                        <div class="col">
                            <h2 class="display-6 fw-bold text-white mb-1" th:text="${album.name}">Album Name</h2>
                            <p class="text-muted mb-3" th:text="${album.description}">Description</p>
                            <div class="d-flex gap-3 align-items-center">
                                <span class="badge bg-dark border border-secondary text-secondary px-3 py-2"
                                    th:text="${album.releaseDate != null ? 'Released: ' + album.releaseDate : 'Date TBA'}"></span>
                                <span class="text-accent-blue small fw-bold">
                                    <i class="fa-solid fa-music me-1"></i> <span th:text="${albumSongs.size()}">0</span>
                                    Tracks
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <!-- Tracks List -->
                <div class="col-lg-8">
                    <div class="card border-0 bg-transparent">
                        <div
                            class="card-header bg-transparent border-0 px-0 d-flex justify-content-between align-items-center">
                            <h5 class="text-white mb-0"><i
                                    class="fa-solid fa-list-ul me-2 text-accent-green"></i>Tracklist</h5>
                        </div>
                        <div class="card-body px-0">
                            <div class="table-responsive">
                                <table class="table table-dark table-hover align-middle analytics-table">
                                    <thead>
                                        <tr>
                                            <th style="width: 50px;">#</th>
                                            <th>Title</th>
                                            <th>Genre</th>
                                            <th class="text-center">Play</th>
                                            <th class="text-center">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="song, iter : ${albumSongs}">
                                            <td class="text-secondary" th:text="${iter.index + 1}">1</td>
                                            <td>
                                                <div class="fw-bold text-white" th:text="${song.title}">Song</div>
                                                <small class="text-muted"
                                                    th:text="${song.duration / 60 + ':' + (song.duration % 60 < 10 ? '0' : '') + (song.duration % 60)}">0:00</small>
                                            </td>
                                            <td><span
                                                    class="badge rounded-pill bg-secondary bg-opacity-25 text-secondary"
                                                    style="font-size: 0.65rem;" th:text="${song.genre}">Genre</span>
                                            </td>
                                            <td class="text-center">
                                                <div class="d-flex justify-content-center gap-2">
                                                    <button class="btn btn-success rounded-circle js-play-btn p-0"
                                                        style="width:32px; height:32px;" th:data-songid="${song.songId}"
                                                        th:data-title="${song.title}" th:data-artist="${user.fullName}"
                                                        th:data-url="${song.songUrl}" th:data-cover="${album.coverArt}"
                                                        title="Play">
                                                        <i class="fa-solid fa-play" style="font-size: 0.8rem;"></i>
                                                    </button>
                                                    <button class="btn btn-outline-danger rounded-circle js-fav-btn p-0"
                                                        style="width:32px; height:32px;" th:data-songid="${song.songId}"
                                                        title="Favorite">
                                                        <i class="fa-solid fa-heart" style="font-size: 0.8rem;"></i>
                                                    </button>
                                                </div>
                                            </td>
                                            <td class="text-center">
                                                <form
                                                    th:action="@{/dashboard/album/{id}/remove-song(id=${album.albumId})}"
                                                    method="POST" style="display:inline;">
                                                    <input type="hidden" name="songId" th:value="${song.songId}">
                                                    <button type="submit" class="btn btn-link text-danger p-0"
                                                        title="Remove from Album">
                                                        <i class="fa-solid fa-trash-can"></i>
                                                    </button>
                                                </form>
                                            </td>
                                        </tr>
                                        <tr th:if="${albumSongs == null || albumSongs.isEmpty()}">
                                            <td colspan="5" class="py-5 text-center empty-state border-secondary">
                                                <i class="fa-solid fa-コンパクトディスク fa-2x mb-3 text-muted"></i>
                                                <p class="mb-0">No songs in this album yet.</p>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Add Song Sidebar -->
                <div class="col-lg-4">
                    <div class="card bg-card border-secondary border-opacity-25 h-100">
                        <div class="card-body p-4">
                            <h6 class="text-white mb-3"><i
                                    class="fa-solid fa-plus-circle me-2 text-accent-green"></i>Add to Album</h6>
                            <p class="text-muted small">Choose from your existing songs to add them to this album.</p>

                            <form th:action="@{/dashboard/album/{id}/add-song(id=${album.albumId})}" method="POST">
                                <div class="mb-3">
                                    <label class="form-label small text-secondary">Select Song</label>
                                    <select name="songId" class="form-select bg-dark border-secondary text-white small"
                                        required>
                                        <option value="" disabled selected>-- Select a song --</option>
                                        <option th:each="s : ${availableSongs}" th:value="${s.songId}"
                                            th:text="${s.title + ' (' + s.genre + ')'}"></option>
                                    </select>
                                    <div th:if="${availableSongs.isEmpty()}" class="mt-2 small text-warning">
                                        <i class="fa-solid fa-circle-info me-1"></i> No available songs to add.
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-success w-100 rounded-pill btn-sm fw-bold"
                                    th:disabled="${availableSongs.isEmpty()}">
                                    <i class="fa-solid fa-plus me-1"></i> Add to Album
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PLAYER -->
    <div th:replace="~{auth/music-player :: player}"></div>

    <script th:inline="javascript">
        const loggedUserId = /*[[${user != null ? user.userId : ''}]]*/ null;
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script th:src="@{/js/player.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Build queue for continuous playback
            if (typeof buildQueueFromPage === 'function') {
                buildQueueFromPage();
            }

            // Re-bind play buttons since we added them dynamically or they use the js-play-btn class
            document.querySelectorAll('.js-play-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var songId = this.getAttribute('data-songid');
                    var title = this.getAttribute('data-title') || 'Unknown';
                    var artist = this.getAttribute('data-artist') || 'Artist';
                    var url = this.getAttribute('data-url') || '';
                    var cover = this.getAttribute('data-cover') || '/images/image1.png';
                    if (typeof playSong === 'function') {
                        playSong(songId, title, artist, url, cover);
                    }
                });
            });
        });

        $(document).ready(function () {
            $('select[name="songId"]').select2({
                placeholder: "-- Select a song --",
                width: '100%'
            });
        });
    </script>
</body>

</html>
