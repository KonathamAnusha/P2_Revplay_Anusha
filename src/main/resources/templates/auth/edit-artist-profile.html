<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Artist Profile - RevPlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/Dashboard.css}">
</head>

<body>
    <div class="d-flex">

        <!-- SIDEBAR -->
        <div th:replace="~{auth/nav-sidebar :: sidebar}"></div>

        <!-- MAIN CONTENT -->
        <div class="flex-grow-1 p-3 content-area-margin">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="welcome-header">
                    <i class="fa-solid fa-user-pen"></i> Edit Artist Profile
                </h4>
                <a href="/dashboard" class="btn btn-outline-light btn-sm rounded-pill">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
                </a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show py-2 small"
                role="alert">
                <i class="fa-solid fa-check-circle me-1"></i> <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close btn-close-white btn-sm" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show py-2 small" role="alert">
                <i class="fa-solid fa-exclamation-circle me-1"></i> <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close btn-close-white btn-sm" data-bs-dismiss="alert"></button>
            </div>

            <form th:action="@{/dashboard/artist/profile}" th:object="${artistDTO}" method="post">

                <!-- Basic Info Card -->
                <div class="card mb-3">
                    <div class="card-body p-3">
                        <h6 class="fw-bold small mb-3"><i
                                class="fa-solid fa-microphone-lines me-1 text-accent-green"></i> Basic Info</h6>
                        <div class="row g-2">
                            <div class="col-md-6">
                                <label for="stageName" class="form-label small mb-1">Stage Name *</label>
                                <input type="text" id="stageName" th:field="*{stageName}"
                                    class="form-control form-control-sm bg-dark text-white border-secondary" required>
                            </div>
                            <div class="col-md-6">
                                <label for="genre" class="form-label small mb-1">Genre *</label>
                                <input type="text" id="genre" th:field="*{genre}"
                                    class="form-control form-control-sm bg-dark text-white border-secondary" required>
                            </div>
                        </div>
                        <div class="mt-2">
                            <label for="bio" class="form-label small mb-1">Bio</label>
                            <textarea id="bio" th:field="*{bio}" rows="3"
                                class="form-control form-control-sm bg-dark text-white border-secondary"
                                placeholder="Tell your fans about yourself..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- Images Card -->
                <div class="card mb-3">
                    <div class="card-body p-3">
                        <h6 class="fw-bold small mb-3"><i class="fa-solid fa-image me-1 text-accent-blue"></i> Images
                        </h6>
                        <div class="row g-2">
                            <div class="col-md-6">
                                <label for="profilePic" class="form-label small mb-1">Profile Picture URL</label>
                                <input type="text" id="profilePic" th:field="*{profilePic}"
                                    class="form-control form-control-sm bg-dark text-white border-secondary"
                                    placeholder="https://...">
                            </div>
                            <div class="col-md-6">
                                <label for="bannerImage" class="form-label small mb-1">Banner Image URL *</label>
                                <input type="text" id="bannerImage" th:field="*{bannerImage}"
                                    class="form-control form-control-sm bg-dark text-white border-secondary"
                                    placeholder="https://..." required>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Social Links Card -->
                <div class="card mb-3">
                    <div class="card-body p-3">
                        <h6 class="fw-bold small mb-3"><i class="fa-solid fa-link me-1 text-accent-purple"></i> Social
                            Media Links</h6>
                        <div class="row g-2">
                            <div class="col-md-4">
                                <label for="instagram" class="form-label small mb-1">
                                    <i class="fa-brands fa-instagram me-1"></i> Instagram
                                </label>
                                <input type="text" id="instagram" th:field="*{instagram}"
                                    class="form-control form-control-sm bg-dark text-white border-secondary"
                                    placeholder="@username">
                            </div>
                            <div class="col-md-4">
                                <label for="twitter" class="form-label small mb-1">
                                    <i class="fa-brands fa-x-twitter me-1"></i> Twitter / X
                                </label>
                                <input type="text" id="twitter" th:field="*{twitter}"
                                    class="form-control form-control-sm bg-dark text-white border-secondary"
                                    placeholder="@username">
                            </div>
                            <div class="col-md-4">
                                <label for="youtube" class="form-label small mb-1">
                                    <i class="fa-brands fa-youtube me-1"></i> YouTube
                                </label>
                                <input type="text" id="youtube" th:field="*{youtube}"
                                    class="form-control form-control-sm bg-dark text-white border-secondary"
                                    placeholder="https://youtube.com/...">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex gap-2 mb-4">
                    <button type="submit" class="btn btn-revplay btn-sm">
                        <i class="fa-solid fa-save me-1"></i> Save Profile
                    </button>
                    <a href="/dashboard" class="btn btn-outline-secondary btn-sm">Cancel</a>
                </div>
            </form>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
