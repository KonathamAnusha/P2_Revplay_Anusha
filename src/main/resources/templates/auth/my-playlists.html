<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Playlists - RevPlay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/Dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/player.css}">
</head>

<body>
    <div class="d-flex">
        <div th:replace="~{auth/nav-sidebar :: sidebar}"></div>
        <div class="flex-grow-1 p-4 content-area-margin">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary">
                <h4 class="welcome-header mb-0"><i class="fa-solid fa-layer-group text-accent-orange"></i> My Playlists
                </h4>
                <button class="btn btn-revplay-orange rounded-pill px-4" data-bs-toggle="modal"
                    data-bs-target="#createPlaylistModal">
                    <i class="fa-solid fa-plus me-1"></i> Create New
                </button>
            </div>

            <div class="row g-4">
                <div th:if="${playlists == null || playlists.isEmpty()}" class="col-12 py-5 text-center">
                    <div class="empty-state border-secondary py-5">
                        <i class="fa-solid fa-folder-open fa-3x mb-3 text-muted"></i>
                        <h5>No playlists yet</h5>
                        <p class="text-muted">Start organizing your favorite tracks by creating a playlist.</p>
                    </div>
                </div>
                <div class="col-md-6 col-xl-4" th:each="pl : ${playlists}">
                    <div class="card bg-glass border-0 shadow-lg h-100 hover-lift">
                        <div class="card-body p-4">
                            <div class="d-flex align-items-start justify-content-between mb-3">
                                <div class="playlist-icon-lg bg-orange-soft text-orange">
                                    <i class="fa-solid fa-music"></i>
                                </div>
                                <span class="badge rounded-pill bg-orange-soft text-orange small"
                                    th:text="${pl.privacy}">PUBLIC</span>
                            </div>
                            <h5 class="text-white fw-bold mb-2" th:text="${pl.name}">Playlist Name</h5>
                            <p class="text-muted small mb-4 text-truncate-2" th:text="${pl.description}">Description</p>

                            <div
                                class="d-flex align-items-center justify-content-between mt-auto pt-3 border-top border-secondary border-opacity-25">
                                <span class="text-secondary small">
                                    <i class="fa-solid fa-list-ul me-1"></i> <span
                                        th:text="${pl.songIds != null ? pl.songIds.size() : 0}">0</span> Tracks
                                </span>
                                <div class="btn-group gap-2">
                                    <a th:href="@{/dashboard/playlists/{id}(id=${pl.playlistId})}"
                                        class="btn btn-outline-light btn-sm rounded-pill px-3">View</a>
                                    <button class="btn btn-link text-danger p-0"
                                        th:onclick="'deletePlaylist(' + ${pl.playlistId} + ')'" title="Delete">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Playlist Modal -->
    <div class="modal fade" id="createPlaylistModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-card border-secondary shadow-2xl">
                <div class="modal-header border-secondary border-opacity-25">
                    <h5 class="modal-title text-white fw-bold"><i
                            class="fa-solid fa-plus-circle me-2 text-accent-orange"></i>New Playlist</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <form th:action="@{/dashboard/playlists/create}" method="post">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label for="playlistName" class="form-label small text-secondary">Playlist Name</label>
                            <input type="text" id="playlistName" name="name"
                                class="form-control bg-dark border-secondary text-white"
                                placeholder="Give your playlist a name" required>
                        </div>
                        <div class="mb-4">
                            <label for="playlistDesc" class="form-label small text-secondary">Description
                                (Optional)</label>
                            <textarea id="playlistDesc" name="description"
                                class="form-control bg-dark border-secondary text-white" rows="3"
                                placeholder="What's this collection about?"></textarea>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small text-secondary">Privacy Setting</label>
                            <div class="d-flex gap-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="privacy" id="privacyPublic"
                                        value="PUBLIC" checked>
                                    <label class="form-check-label text-white small" for="privacyPublic">
                                        <i class="fa-solid fa-globe me-1 text-muted"></i> Public
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="privacy" id="privacyPrivate"
                                        value="PRIVATE">
                                    <label class="form-check-label text-white small" for="privacyPrivate">
                                        <i class="fa-solid fa-lock me-1 text-muted"></i> Private
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-secondary border-opacity-25 p-3">
                        <button type="button" class="btn btn-link text-secondary text-decoration-none"
                            data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-revplay-orange rounded-pill px-4">Create Playlist</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{auth/music-player :: player}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/player.js}"></script>
    <script th:inline="javascript">
        function deletePlaylist(id) {
            if (confirm('Delete this playlist?')) {
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = '/dashboard/playlists/delete/' + id;
                document.body.appendChild(form);
                form.submit();
            }
        }
    </script>

</body>

</html>
