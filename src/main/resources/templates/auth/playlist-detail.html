<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playlist - RevPlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/Dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/player.css}">
    <style>
        .select2-container--default .select2-selection--single {
            background-color: #212529 !important;
            border: 1px solid rgba(255, 255, 255, 0.25) !important;
            height: 38px !important;
        }

        .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: #fff !important;
            line-height: 36px !important;
        }

        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 36px !important;
        }

        .select2-dropdown {
            background-color: #212529 !important;
            border: 1px solid rgba(255, 255, 255, 0.25) !important;
            color: #fff !important;
        }

        .select2-container--default .select2-search--dropdown .select2-search__field {
            background-color: #2b3035 !important;
            color: #fff !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }

        .select2-container--default .select2-results__option[aria-selected=true] {
            background-color: #495057 !important;
        }

        .select2-container--default .select2-results__option--highlighted[aria-selected] {
            background-color: #ea580c !important;
            /* using orange for playlists */
        }
    </style>
</head>

<body>
    <div class="d-flex">
        <div th:replace="~{auth/nav-sidebar :: sidebar}"></div>
        <div class="flex-grow-1 p-4 overflow-auto content-area-margin">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <a th:href="@{/dashboard/playlists}" class="btn btn-outline-light btn-sm rounded-pill"
                    title="Back to Playlists">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back
                </a>
                <div class="text-accent-orange small fw-bold"><i class="fa-solid fa-folder-open"></i> Playlist Details
                </div>
            </div>

            <!-- Playlist Header Card -->
            <div class="card mb-4 bg-glass border-0 shadow-lg">
                <div class="card-body p-4">
                    <div class="row align-items-center">
                        <div class="col-auto">
                            <div class="rounded shadow-lg bg-dark d-flex align-items-center justify-content-center"
                                style="width:160px;height:160px;background: linear-gradient(135deg, #f97316, #ea580c);">
                                <i class="fa-solid fa-music fa-4x text-white opacity-50"></i>
                            </div>
                        </div>
                        <div class="col">
                            <div class="d-flex align-items-center gap-2 mb-1">
                                <span class="badge rounded-pill bg-orange-soft text-orange small px-2"
                                    th:text="${playlist.privacy}">PUBLIC</span>
                            </div>
                            <h2 class="display-6 fw-bold text-white mb-1" th:text="${playlist.name}">Playlist Name</h2>
                            <p class="text-muted mb-3" th:text="${playlist.description}">Description</p>
                            <div class="d-flex gap-3 align-items-center">
                                <span class="text-accent-orange small fw-bold">
                                    <i class="fa-solid fa-list-ul me-1"></i> <span
                                        th:text="${playlistSongs.size()}">0</span> Songs
                                </span>
                                <span class="text-muted small" th:if="${user != null}">
                                    <i class="fa-solid fa-user me-1"></i> Curated by <span
                                        th:text="${user.fullName}">User</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <!-- Tracks List -->
                <div class="col-lg-8">
                    <div class="card border-0 bg-transparent">
                        <div
                            class="card-header bg-transparent border-0 px-0 d-flex justify-content-between align-items-center">
                            <h5 class="text-white mb-0"><i
                                    class="fa-solid fa-play-circle me-2 text-accent-orange"></i>Tracks</h5>
                        </div>
                        <div class="card-body px-0">
                            <div class="table-responsive">
                                <table class="table table-dark table-hover align-middle analytics-table">
                                    <thead>
                                        <tr>
                                            <th style="width: 50px;">#</th>
                                            <th>Title</th>
                                            <th>Artist</th>
                                            <th class="text-center">Play</th>
                                            <th class="text-center">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="song, iter : ${playlistSongs}">
                                            <td class="text-secondary" th:text="${iter.index + 1}">1</td>
                                            <td>
                                                <div class="fw-bold text-white" th:text="${song.title}">Song</div>
                                                <small class="text-muted" th:text="${song.genre}">Genre</small>
                                            </td>
                                            <td class="text-muted small"
                                                th:text="${song.artistName != null ? song.artistName : 'Unknown'}">
                                                Artist</td>
                                            <td class="text-center">
                                                <div class="d-flex justify-content-center gap-2">
                                                    <button class="btn btn-success rounded-circle js-play-btn p-0"
                                                        style="width:32px; height:32px;" th:data-songid="${song.songId}"
                                                        th:data-title="${song.title}"
                                                        th:data-artist="${song.artistName}"
                                                        th:data-url="${song.songUrl}" title="Play">
                                                        <i class="fa-solid fa-play" style="font-size: 0.8rem;"></i>
                                                    </button>
                                                    <button
                                                        class="btn btn-outline-danger btn-sm rounded-pill px-2 js-fav-btn"
                                                        th:data-songid="${song.songId}" title="Add to Favorites">
                                                        <i class="fa-solid fa-heart"></i>
                                                    </button>
                                                </div>
                                            </td>
                                            <td class="text-center">
                                                <button type="button" class="btn btn-link text-danger p-0 js-remove-btn"
                                                    th:data-songid="${song.songId}" title="Remove from Playlist">
                                                    <i class="fa-solid fa-trash-can"></i>
                                                </button>
                                            </td>
                                        </tr>
                                        <tr th:if="${playlistSongs == null || playlistSongs.isEmpty()}">
                                            <td colspan="5" class="py-5 text-center empty-state border-secondary">
                                                <i class="fa-solid fa-folder-open fa-2x mb-3 text-muted"></i>
                                                <p class="mb-0">No songs in this playlist yet.</p>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Add Song Sidebar -->
                <div class="col-lg-4">
                    <div class="card bg-card border-secondary border-opacity-25 shadow-sm">
                        <div class="card-body p-4">
                            <h6 class="text-white mb-3"><i
                                    class="fa-solid fa-plus-circle me-2 text-accent-orange"></i>Add Songs</h6>
                            <p class="text-muted small">Search and add any song to your playlist.</p>

                            <div class="mb-3">
                                <label class="form-label small text-secondary">Find Songs</label>
                                <select id="addSongSelect" class="form-select bg-dark border-secondary text-white small"
                                    required>
                                    <option value="" disabled selected>-- Choose a song --</option>
                                    <option th:each="s : ${allSongs}" th:value="${s.songId}"
                                        th:text="${s.title + ' (' + (s.artistName != null ? s.artistName : 'Unknown') + ')'}">
                                    </option>
                                </select>
                            </div>
                            <button type="button" id="addSongBtn"
                                class="btn btn-revplay-orange w-100 rounded-pill btn-sm fw-bold">
                                <i class="fa-solid fa-plus me-1"></i> Add to Playlist
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PLAYER -->
    <div th:replace="~{auth/music-player :: player}"></div>

    <script th:inline="javascript">
        const loggedUserId = /*[[${user != null ? user.userId : ''}]]*/ null;
        const playlistId = /*[[${playlist.playlistId}]]*/ null;
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script th:src="@{/js/player.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Build queue for continuous playback
            if (typeof buildQueueFromPage === 'function') {
                buildQueueFromPage();
            }

            // Play buttons
            document.querySelectorAll('.js-play-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var songId = this.getAttribute('data-songid');
                    var title = this.getAttribute('data-title') || 'Unknown';
                    var artist = this.getAttribute('data-artist') || 'Artist';
                    var url = this.getAttribute('data-url') || '';
                    if (typeof playSong === 'function') {
                        playSong(songId, title, artist, url, '/images/image1.png');
                    }
                });
            });

            // Remove from playlist
            document.querySelectorAll('.js-remove-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var songId = this.getAttribute('data-songid');
                    if (!confirm('Remove this song from your playlist?')) return;

                    fetch('/api/playlist-songs/remove?playlistId=' + playlistId + '&songId=' + songId, {
                        method: 'DELETE'
                    })
                        .then(res => {
                            if (res.ok) location.reload();
                            else alert('Could not remove song. Please try again.');
                        });
                });
            });

            // Add song to playlist
            const addBtn = document.getElementById('addSongBtn');
            if (addBtn) {
                addBtn.addEventListener('click', function () {
                    const songId = document.getElementById('addSongSelect').value;
                    if (!songId) { alert('Please select a song first.'); return; }

                    fetch('/api/playlist-songs/add?playlistId=' + playlistId + '&songId=' + songId, {
                        method: 'POST'
                    })
                        .then(res => {
                            if (res.ok) location.reload();
                            else alert('Could not add song. It might already be in the playlist.');
                        });
                });
            }

            // Favorite button
            document.querySelectorAll('.js-fav-btn').forEach(btn => {
                btn.addEventListener('click', function () {
                    if (!loggedUserId) { alert('Please log in.'); return; }
                    const songId = this.getAttribute('data-songid');
                    fetch('/api/favorites?userId=' + loggedUserId + '&songId=' + songId, {
                        method: 'POST'
                    })
                        .then(res => {
                            if (res.ok) alert('Added to favorites!');
                            else alert('Failed to favorite. It might already be in your list.');
                        });
                });
            });
        });

        $(document).ready(function () {
            $('#addSongSelect').select2({
                placeholder: "-- Choose a song --",
                width: '100%'
            });
        });
    </script>
</body>

</html>
