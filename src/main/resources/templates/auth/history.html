<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>History - RevPlay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/Dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/player.css}">
</head>

<body>
    <div class="d-flex">
        <div th:replace="~{auth/nav-sidebar :: sidebar}"></div>
        <div class="flex-grow-1 p-4 content-area-margin">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4>📜 Listening History</h4>
                <form th:action="@{/dashboard/history/clear}" method="post">
                    <button type="submit" class="btn btn-outline-danger"
                        onclick="return confirm('Clear all listening history?')">Clear History</button>
                </form>
            </div>

            <table class="table table-dark table-hover">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Song ID</th>
                        <th>Played At</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="h, iter : ${history}">
                        <td th:text="${iter.index + 1}">1</td>
                        <td th:text="${h.songId}">Song ID</td>
                        <td th:text="${#temporals.format(h.playedAt, 'yyyy-MM-dd HH:mm:ss')}">Time</td>
                        <td>
                            <button class="btn btn-sm btn-success" th:onclick="'playSong(' + ${h.songId} + ')'"
                                title="Play Song" aria-label="Play Song">▶</button>
                        </td>
                    </tr>
                    <tr th:if="${history == null || history.isEmpty()}">
                        <td colspan="4" class="text-center text-muted">No listening history yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div th:replace="~{auth/music-player :: player}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/player.js}"></script>
    <script th:inline="javascript">
        function playSong(songId) {
            fetch('/api/playback/start/' + songId, { method: 'POST' });
            alert('Playing song ' + songId);
        }
    </script>

</body>

</html>
