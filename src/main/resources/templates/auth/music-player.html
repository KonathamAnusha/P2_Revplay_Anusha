<!-- Music Player Fragment -->
<div th:fragment="player" id="music-player" class="music-player bg-dark text-white fixed-bottom w-100"
    style="display:none;">
    <div class="container-fluid">
        <div class="row align-items-center p-2">
            <!-- Song Info -->
            <div class="col-3 d-flex align-items-center">
                <img id="player-cover" src="/images/image1.png" alt="Song Cover" class="rounded me-3 player-cover-img">
                <div class="overflow-hidden">
                    <div id="player-title" class="fw-bold text-truncate small">No song</div>
                    <div id="player-artist" class="text-secondary text-truncate small">Select a song</div>
                </div>
            </div>

            <!-- Controls -->
            <div class="col-6 text-center">
                <div class="mb-1">
                    <button type="button" class="btn btn-sm btn-outline-light border-0" onclick="toggleShuffle()"
                        id="btn-shuffle" title="Shuffle">🔀</button>
                    <button type="button" class="btn btn-sm btn-outline-light border-0" onclick="prevSong()"
                        title="Previous">⏮</button>
                    <button type="button" class="btn btn-sm btn-light rounded-circle" onclick="togglePlay()"
                        id="btn-play" title="Play/Pause">▶️</button>
                    <button type="button" class="btn btn-sm btn-outline-light border-0" onclick="nextSong()"
                        title="Next">⏭</button>
                    <button type="button" class="btn btn-sm btn-outline-light border-0" onclick="toggleRepeat()"
                        id="btn-repeat" title="Repeat">🔁</button>
                </div>
                <div class="d-flex align-items-center">
                    <span id="current-time" class="small me-2 player-time-badge">0:00</span>
                    <input type="range" id="seek-bar" class="form-range flex-grow-1" min="0" max="100" value="0">
                    <span id="total-time" class="small ms-2 player-time-badge">0:00</span>
                </div>
            </div>

            <!-- Volume -->
            <div class="col-3 d-flex align-items-center justify-content-end">
                <span class="me-2">🔊</span>
                <input type="range" id="volume-bar" class="form-range player-volume-control" min="0" max="100"
                    value="80">
            </div>
        </div>
    </div>
    <!-- Hidden audio element -->
    <audio id="main-audio"></audio>
</div>
