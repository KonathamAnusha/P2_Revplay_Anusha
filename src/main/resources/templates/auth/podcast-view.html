<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'RevPlay - ' + ${podcast.title}">Podcast - RevPlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/Dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/player.css}">
</head>

<body>
    <div class="d-flex">
        <div th:replace="~{auth/nav-sidebar :: sidebar}"></div>
        <div class="flex-grow-1 p-4 content-area-margin overflow-auto">

            <!-- Back Link -->
            <a href="/dashboard" class="text-info text-decoration-none mb-3 d-inline-block">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
            </a>

            <!-- Podcast Hero Card -->
            <div class="card p-4 mt-2 mb-4"
                style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); border: none;">
                <div class="d-flex align-items-center gap-4">
                    <img th:src="${podcast.coverImage != null && !podcast.coverImage.isEmpty() ? podcast.coverImage : '/images/image2.png'}"
                        class="rounded-3 shadow-lg" style="width:180px;height:180px;object-fit:cover"
                        onerror="this.src='/images/image2.png'" alt="Podcast Cover">
                    <div>
                        <span class="badge bg-success-soft text-success small mb-2">
                            <i class="fa-solid fa-podcast me-1"></i> PODCAST
                        </span>
                        <h2 class="fw-bold text-white mb-1" th:text="${podcast.title}">Podcast Title</h2>
                        <p class="text-muted mb-2" th:if="${podcast.hostName != null}">
                            <i class="fa-solid fa-user me-1"></i>
                            <span th:text="${podcast.hostName}">Host</span>
                        </p>
                        <span class="badge bg-secondary me-2" th:if="${podcast.genreName != null}">
                            <i class="fa-solid fa-tag me-1"></i> <span th:text="${podcast.genreName}"></span>
                        </span>
                        <span class="text-muted small" th:if="${podcast.episodes != null}">
                            <i class="fa-solid fa-headphones me-1"></i>
                            <span th:text="${podcast.episodes.size()}">0</span> episodes
                        </span>
                        <p class="mt-3 mb-0 text-muted"
                            th:if="${podcast.description != null && !podcast.description.isEmpty()}"
                            th:text="${podcast.description}" style="max-width: 600px;">Description</p>
                    </div>
                </div>
            </div>

            <!-- Episodes List -->
            <div class="mb-4">
                <h5 class="section-title mb-3">
                    <i class="fa-solid fa-list me-2 text-success"></i> All Episodes
                </h5>

                <!-- Episodes Table -->
                <div class="card bg-card border-0 shadow-lg overflow-hidden"
                    th:if="${podcast.episodes != null && !podcast.episodes.isEmpty()}">
                    <div class="card-body p-0">
                        <table class="table table-dark table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-4" style="width:50px">#</th>
                                    <th>Title</th>
                                    <th>Duration</th>
                                    <th>Released</th>
                                    <th class="text-end pe-4">Play</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="ep, iter : ${podcast.episodes}">
                                    <td class="ps-4">
                                        <span class="text-muted" th:text="${iter.index + 1}">1</span>
                                    </td>
                                    <td>
                                        <div class="d-flex align-items-center gap-3">
                                            <div class="bg-dark rounded d-flex align-items-center justify-content-center"
                                                style="width:40px;height:40px;min-width:40px;">
                                                <i class="fa-solid fa-podcast text-success"></i>
                                            </div>
                                            <div>
                                                <div class="fw-semibold text-white" th:text="${ep.title}">Episode Title
                                                </div>
                                                <small class="text-muted text-truncate d-block" style="max-width:400px;"
                                                    th:if="${ep.description != null && !ep.description.isEmpty()}"
                                                    th:text="${ep.description}">Description</small>
                                            </div>
                                        </div>
                                    </td>
                                    <td>
                                        <span class="text-muted small"
                                            th:text="${ep.duration > 0 ? (ep.duration / 60) + ':' + (ep.duration % 60 < 10 ? '0' : '') + (ep.duration % 60) : '--:--'}">--:--</span>
                                    </td>
                                    <td>
                                        <span class="text-muted small" th:if="${ep.releaseDate != null}"
                                            th:text="${#temporals.format(ep.releaseDate, 'MMM dd, yyyy')}"></span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <button class="btn btn-sm btn-success rounded-circle js-play-btn"
                                            style="width:36px;height:36px;" th:data-songid="${ep.episodeId}"
                                            th:data-title="${ep.title}"
                                            th:data-artist="${podcast.hostName != null ? podcast.hostName : 'Podcast'}"
                                            th:data-url="${ep.audioUrl}"
                                            th:data-cover="${podcast.coverImage != null ? podcast.coverImage : '/images/image2.png'}"
                                            title="Play Episode">
                                            <i class="fa-solid fa-play"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- No Episodes -->
                <div th:if="${podcast.episodes == null || podcast.episodes.isEmpty()}"
                    class="card bg-card border-0 shadow-lg">
                    <div class="card-body py-5 text-center">
                        <i class="fa-solid fa-podcast fa-3x mb-3 text-muted opacity-25"></i>
                        <p class="text-muted mb-0">No episodes available yet. Check back soon!</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div th:replace="~{auth/music-player :: player}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/player.js}"></script>
    <script th:inline="javascript">
        const loggedUserId = /*[[${user != null ? user.userId : ''}]]*/ null;

        document.addEventListener('DOMContentLoaded', function () {
            // Play buttons for episodes
            document.querySelectorAll('.js-play-btn').forEach(btn => {
                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const songId = this.getAttribute('data-songid');
                    const title = this.getAttribute('data-title');
                    const artist = this.getAttribute('data-artist');
                    const url = this.getAttribute('data-url');
                    const cover = this.getAttribute('data-cover');

                    if (typeof playSong === 'function') {
                        playSong(songId, title, artist, url, cover);
                    }
                });
            });
        });
    </script>

    <!-- Footer -->
    <footer class="footer mt-auto py-3 text-center"
        style="background-color: #0d1017; color: #94a3b8; border-top: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.85rem; width: 100%;">
        <div class="container">
            <span class="text-muted"><i class="fa-regular fa-copyright me-1"></i> 2024 RevPlay. All rights
                reserved by Revature.</span>
        </div>
    </footer>

</body>

</html>
