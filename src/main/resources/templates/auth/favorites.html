<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Favorites - RevPlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/Dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/player.css}">
</head>

<body>
    <div class="d-flex">
        <div th:replace="~{auth/nav-sidebar :: sidebar}"></div>
        <div class="flex-grow-1 p-4 content-area-margin">
            <h4 class="welcome-header mb-4"><i class="fa-solid fa-heart me-2 text-danger"></i> My Favorites</h4>

            <div class="row g-3 mb-4">
                <div th:if="${favoriteSongs == null || favoriteSongs.isEmpty()}">
                    <div class="empty-state">
                        <i class="fa-solid fa-heart-crack fa-2x mb-2 d-block text-muted"></i>
                        <span class="text-light">You haven't added any favorites yet.</span>
                    </div>
                </div>

                <!-- SONGS TABLE -->
                <div th:if="${favoriteSongs != null && !favoriteSongs.isEmpty()}">
                    <table class="table table-dark table-hover" style="border-radius:12px;overflow:hidden">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Title</th>
                                <th>Artist</th>
                                <th>Album</th>
                                <th>Duration</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="song, iter : ${favoriteSongs}" th:id="'song-row-' + ${song.songId}">
                                <td th:text="${iter.index + 1}">1</td>
                                <td>
                                    <img th:src="${song.coverArt != null ? song.coverArt : '/images/image1.png'}"
                                        style="width:30px;height:30px;object-fit:cover" class="rounded me-2">
                                    <a th:href="@{/dashboard/song/{id}(id=${song.songId})}"
                                        class="text-info text-decoration-none fw-semibold"
                                        th:text="${song.title}">Song</a>
                                </td>
                                <td>
                                    <a th:if="${song.artistId != null}"
                                        th:href="@{/dashboard/artist/{id}(id=${song.artistId})}"
                                        class="text-white text-decoration-none"
                                        th:text="${song.artistName != null ? song.artistName : '-'}">Artist</a>
                                    <span th:if="${song.artistId == null}">-</span>
                                </td>
                                <td>
                                    <a th:if="${song.albumId != null}"
                                        th:href="@{/dashboard/album/{id}(id=${song.albumId})}"
                                        class="text-light text-decoration-none"
                                        th:text="${song.albumName != null ? song.albumName : '-'}">Album</a>
                                    <span th:if="${song.albumId == null}" class="text-muted">Single</span>
                                </td>
                                <td
                                    th:text="${song.duration / 60 + ':' + (song.duration % 60 < 10 ? '0' : '') + song.duration % 60}">
                                    0:00</td>
                                <td>
                                    <button class="btn btn-sm btn-success rounded-pill" title="Play"
                                        th:onclick="playSong([[${song.songId}]], [[${song.title}]], [[${song.artistName != null ? song.artistName : 'Unknown'}]], [[${song.songUrl}]], [[${song.coverArt != null ? song.coverArt : '/images/image1.png'}]])"><i
                                            class="fa-solid fa-play"></i></button>
                                    <button class="btn btn-sm btn-danger rounded-pill ms-1"
                                        th:onclick="'removeFavorite(' + ${song.songId} + ')'" title="Remove Favorite"><i
                                            class="fa-solid fa-heart-crack"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Inject JS variable for logged user -->
    <script th:inline="javascript">
        const loggedUserId = /*[[${user.userId}]]*/ null;
    </script>

    <div th:replace="~{auth/music-player :: player}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/player.js}"></script>

    <script>
        function removeFavorite(songId) {
            fetch('/dashboard/favorites/add/' + songId, { method: 'POST' })
                .then(res => res.text())
                .then(data => {
                    if (data === "Removed from favorites") {
                        // Remove the row from the table
                        document.getElementById('song-row-' + songId).remove();
                    } else {
                        alert(data);
                    }
                })
                .catch(err => console.error(err));
        }
    </script>
</body>

</html>
