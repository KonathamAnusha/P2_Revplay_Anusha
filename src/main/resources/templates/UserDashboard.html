<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RevPlay - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<div class="d-flex">

    <!-- Sidebar -->
    <div class="sidebar p-3">
        <h4 class="mb-4">🎵 RevPlay</h4>
        <a href="/" class="nav-link">🏠 Home</a>
        <a href="#" th:if="${role.name() == 'LISTENER'}" class="nav-link">❤️ Favorites</a>
        <a href="#" th:if="${role.name() == 'LISTENER'}" class="nav-link">📂 Playlists</a>
        <a href="#" th:if="${role.name() == 'ARTIST'}" class="nav-link">🎵 My Songs</a>
        <a href="#" th:if="${role.name() == 'ARTIST'}" class="nav-link">📊 Analytics</a>
        <a th:href="@{/profile/{id}(id=${user.userId})}" class="nav-link">👤 Profile</a>
        <hr>
        <a href="/auth/logout" class="nav-link text-danger">Logout</a>
    </div>

    <!-- Main Content -->
    <div class="flex-grow-1 p-4">
        <h4>Welcome, <span th:text="${user.displayName}"></span> 👋</h4>

        <!-- Listener View -->
        <div th:if="${role.name() == 'LISTENER'}">
            <div class="row text-center mt-4">
                <div class="col-md-4 mb-3">
                    <div class="card bg-secondary p-3">
                        <h5>Total Playlists</h5>
                        <h3 th:text="${playlists.size()}">0</h3>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="card bg-secondary p-3">
                        <h5>Favorite Songs</h5>
                        <h3 th:text="${favorites.size()}">0</h3>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="card bg-secondary p-3">
                        <h5>Listening Time</h5>
                        <h3 th:text="${listeningTime}">0 sec</h3>
                    </div>
                </div>
            </div>

            <!-- Recently Played -->
            <h5 class="mt-4">Recently Played</h5>
            <div class="row" th:each="song : ${recentlyPlayed}">
                <div class="col-md-3 mb-3">
                    <div class="card bg-secondary text-white">
                        <img th:src="${song.coverImage}" class="card-img-top">
                        <div class="card-body">
                            <h6 th:text="${song.title}"></h6>
                            <small th:text="${song.artistName}"></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Artist View -->
        <div th:if="${role.name() == 'ARTIST'}">
            <h5 class="mt-4">Artist Dashboard</h5>
            <p>Stage Name: <span th:text="${user.artistProfile.stageName}"></span></p>
            <p>Genre: <span th:text="${user.artistProfile.genre}"></span></p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
